<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potential Intelligence™ · Talent Report Sample</title>
  <style>html,body{margin:0;height:100%;background:#c8c4bc}iframe{width:100%;height:100vh;border:0;display:block}</style>
</head>
<body>
  <iframe id="reportFrame" src="sample_report.html" title="Talent Report Sample"></iframe>
  <script>
    const selectedTab='hr';
    const activeIndex=2;
    const frame=document.getElementById('reportFrame');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;
        doc.querySelectorAll('.report-wrap').forEach(el=>el.classList.remove('visible'));
        doc.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
        doc.getElementById('tab-'+selectedTab).classList.add('visible');
        const btn=doc.querySelectorAll('.tab-btn')[activeIndex];
        if(btn) btn.classList.add('active');
        frame.contentWindow.scrollTo(0,0);
      }catch(e){}
    });
  </script>
</body>
</html>
